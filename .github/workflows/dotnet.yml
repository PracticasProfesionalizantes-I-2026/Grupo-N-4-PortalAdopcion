name: Compilar y probar
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PortalAdopcion.slnx
      - run: dotnet build PortalAdopcion.slnx --no-restore
      - run: dotnet test PortalAdopcion.slnx --no-build --no-restore
